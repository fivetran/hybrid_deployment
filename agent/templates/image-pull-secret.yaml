  name: {{ include "hd.agentImagePullSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: hd-agent-regcred
    {{- include "hd.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ include "hd.agentDockerConfigJson" . | b64enc }}
{{- end }}
